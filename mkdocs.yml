# TAPPaaS Documentation Site Configuration
# https://www.mkdocs.org/user-guide/configuration/

site_name: TAPPaaS
site_url: https://tappaas.org/
site_description: Open Source Platform as a Service - Documentation and Resources
site_author: TAPPaaS Community

# Repository
repo_name: TAPPaaS/TAPPaaS
repo_url: https://codeberg.org/TAPPaaS/TAPPaaS
edit_uri: ""

# Copyright
copyright: Copyright &copy; 2026 TAPPaaS Contributors | Licensed under MPL 2.0

# Theme Configuration
theme:
  name: material
  language: en
  # Landing home template + single-line header (ADR-001 §5.5 revision)
  custom_dir: overrides

  # Color palette
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

  # Custom assets
  icon:
    repo: simple/codeberg

  # Logo and favicon
  logo: tappaas-icon.png
  # favicon: assets/favicon.ico

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # Directory nav entries (trailing /) resolve via that dir's SUMMARY.md,
  # which scripts/sync-source.py generates — new upstream managers/controllers
  # appear in the nav automatically (ADR-001 §12.1/12.2).
  - literate-nav:
      nav_file: SUMMARY.md
  - minify:
      minify_html: true
  - kroki:
      # Use localhost for CI (self-hosted Kroki service) or kroki.io for fallback
      # CI sets up Kroki service container on localhost:8000
      server_url: http://localhost:8000
      enable_block_diag: true
      http_method: POST
      file_types:
        - svg

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: TAPPaaS
      repo: Documentation
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ["docs"]
      auto_append:
        - includes/abbreviations.md
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS
extra_css:
  - stylesheets/extra.css
  - stylesheets/landing.css

# Extra JavaScript
extra_javascript:
  - javascripts/extra.js
  - javascripts/landing.js

# Social links and extra configuration
extra:
  social:
    - icon: simple/codeberg
      link: https://codeberg.org/TAPPaaS
      name: TAPPaaS on Codeberg
    # Add more social links as needed:
    # - icon: fontawesome/brands/twitter
    #   link: https://twitter.com/tappaas
    # - icon: fontawesome/brands/discord
    #   link: https://discord.gg/tappaas

  # Analytics (uncomment and configure when ready)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

  generator: false

