# TAPPaaS Documentation Site Configuration
# https://www.mkdocs.org/user-guide/configuration/

site_name: TAPPaaS
site_url: https://tappaas.org/
site_description: Open Source Platform as a Service - Documentation and Resources
site_author: TAPPaaS Community

# Repository
repo_name: TAPPaaS/TAPPaaS
repo_url: https://codeberg.org/TAPPaaS/TAPPaaS
edit_uri: ""

# Copyright
copyright: Copyright &copy; 2026 TAPPaaS Contributors | Licensed under MPL 2.0

# Theme Configuration
theme:
  name: material
  language: en
  # Landing home template + single-line header (ADR-001 §5.5 revision)
  custom_dir: overrides

  # Color palette
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

  # Custom assets
  icon:
    repo: simple/codeberg

  # Logo and favicon
  logo: tappaas-icon.png
  # favicon: assets/favicon.ico

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # Directory nav entries (trailing /) resolve via that dir's SUMMARY.md,
  # which scripts/sync-source.py generates — new upstream managers/controllers
  # appear in the nav automatically (ADR-001 §12.1/12.2).
  - literate-nav:
      nav_file: SUMMARY.md
  - minify:
      minify_html: true
  - kroki:
      # Use localhost for CI (self-hosted Kroki service) or kroki.io for fallback
      # CI sets up Kroki service container on localhost:8000
      server_url: http://localhost:8000
      enable_block_diag: true
      http_method: POST
      file_types:
        - svg

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  # Plain URLs become links. "#123" is NOT linked here: magiclink can only point it at
  # GitHub, and the issues live on Codeberg — scripts/sync-source.py links them.
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ["docs"]
      auto_append:
        - includes/abbreviations.md
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS
extra_css:
  - stylesheets/extra.css
  - stylesheets/landing.css

# Extra JavaScript
extra_javascript:
  - javascripts/extra.js
  - javascripts/landing.js

# Social links and extra configuration
extra:
  social:
    - icon: simple/codeberg
      link: https://codeberg.org/TAPPaaS
      name: TAPPaaS on Codeberg
    # Add more social links as needed:
    # - icon: fontawesome/brands/twitter
    #   link: https://twitter.com/tappaas
    # - icon: fontawesome/brands/discord
    #   link: https://discord.gg/tappaas

  # Analytics (uncomment and configure when ready)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

  generator: false

# Navigation structure (Terraform-style)
nav:
  - Why:
    - Overview: why/index.md
    - Digital Sovereignty: why/digital-sovereignty.md
    - Examples: why/examples.md

  - What:
    - Principles: what/principles.md
    - Capabilities: what/capabilities.md
    - Module Model:
      - Overview: what/module-model.md
      - Module Dependencies: generated/module-dependencies.md
    - ADRs: generated/adrs.md
    - Design:
      - Overview: what/design.md
      - Security: what/security-design.md
      - Cluster: generated/design/cluster.md
      - Network: generated/design/network.md
      - Backup: generated/design/backup.md
      - CICD Mothership:
        - Overview: generated/design/cicd-mothership.md
        - Git & Repository Topology: generated/design/cicd-git.md
        - Foundation Dependencies: generated/design/foundation-dependencies.md
      - Schemas: generated/schemas.md
    - Meta Model: what/meta-model.md
    - Glossary: generated/ontology.md

  - Install:
    - Overview: install/index.md
    - Hardware Selection: generated/hardware-selection.md
    - Preparation: generated/preparation.md
    - Install Foundation: generated/install.md
    - Configure Environments: generated/install-environment.md
    - Add Satellite: generated/satellite-install.md
    # One section per TAPPaaS stack directory src/<stack>/ (README = overview,
    # module INSTALL.md files under it) — generated by scripts/sync-source.py.
    - Add Workloads: generated/install/

  - Operate:
    - Overview: operate/index.md
    - Admin Access:
      - Overview: operate/admin-access.md
      - Admin VPN (WireGuard): generated/admin-vpn.md
    - Managers: generated/managers/
    - Controllers: generated/controllers/
    - Network Zones: generated/zones.md
    - Disaster Recovery: generated/disaster-recovery.md

  - Develop:
    - Overview: develop/index.md
    - Develop a Module: generated/develop-a-module.md
    - Module Details: generated/module-template.md
    - Moving a Module's Source: generated/move-module.md
    - Config Migrations: generated/config-migrations.md
    - Foundation Services: generated/services/
    - TAPPaaS Build Process: generated/build.md
    - Release Train: generated/release-train.md

  # Overview (stacks/index.md, hand-written), then one section per TAPPaaS stack
  # directory src/<stack>/: its README and its modules' READMEs — generated by
  # scripts/sync-source.py into stacks/SUMMARY.md.
  - Stacks: stacks/

  - Roadmap: roadmap/index.md

  - About:
    - People: about/people.md
    - Logo: about/logo.md
    - Inspiration: about/inspiration.md
    - License: about/license.md
