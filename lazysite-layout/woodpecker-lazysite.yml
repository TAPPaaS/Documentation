# The docs pipeline for the lazysite-served site (TAPPaaS
# docs/design/tappaas-org-website.md §6), run by the site's own Woodpecker
# (woodpecker-tappaas) on this repository in the tappaas Forgejo. Codeberg's CI
# keeps using .woodpecker.yml; in woodpecker-tappaas this repository's
# "Pipeline config path" is set to lazysite-layout/woodpecker-lazysite.yml.
#
# No MkDocs build: the sync writes Markdown, the converter normalises it for
# lazysite's renderer and adds the navigation, the search index and the layout,
# and the result is pushed to the branch the lazysite instance serves
# (repoBranch), live within a minute.
#
# Push: Woodpecker's pipelines reach Forgejo only through the proxy, so the push
# goes over HTTPS as the instance's push user (forgejo:repo repoPushUser:
# push-<vmname>). Prerequisites (one-time):
#   - the lazysite instance with repoBranch=live and repoPushUser=true;
#   - the Woodpecker secret site_push_token: the token forgejo:repo wrote to
#     ~/secrets/forgejo-push.<module>.token on the mothership;
#   - SITE_REPO and SITE_USER below naming that instance.
# On two sites (hosting design §5): a second publish step with the other site's
# repository and token.
#
# Previews: none yet. Pages link site-absolute (/generated/...), so a preview is a
# second lazysite instance serving another branch, not a sub-directory.

when:
  - event: [push, manual]
    branch: [main, spike-lazysite]

steps:
  build:
    image: python:3.12-slim
    environment:
      KROKI_URL: http://kroki:8000
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl && rm -rf /var/lib/apt/lists/*
      - pip install --no-cache-dir pyyaml
      - |
        for _ in $(seq 30); do curl -sf http://kroki:8000/health >/dev/null && break; sleep 2; done
      - python scripts/sync-source.py
      - ./scripts/lazysite-vendor.sh
      - python scripts/lazysite-site.py site

  publish:
    image: alpine:3.20
    environment:
      SITE_REPO: https://forgejo.tappaas.hrossen.dk/websites/lazysite-tappaas.git
      SITE_USER: push-lazysite-tappaas
      SITE_BRANCH: live
      SITE_PUSH_TOKEN:
        from_secret: site_push_token
    commands:
      - apk add --no-cache git rsync
      - git config --global user.email "ci@tappaas.org"
      - git config --global user.name "TAPPaaS docs"
      # The token reaches git through a credential helper, never the command line or a URL in the log.
      - git config --global credential.helper '!f() { echo "username=$SITE_USER"; echo "password=$SITE_PUSH_TOKEN"; }; f'
      # The site records which source commit it was built from (.tappaas-published,
      # never served: lazysite answers dot-files 404). A build of an older commit than
      # the one published never publishes: an older build finishing last would roll
      # the site back. The commit time comes from the workspace clone, so nothing has
      # to read the source repository again.
      - |
        SRC_CT=$(git log -1 --format=%ct)
        rm -rf out
        git clone -q --depth 1 --branch "$SITE_BRANCH" "$SITE_REPO" out 2>/dev/null || git init -q -b "$SITE_BRANCH" out
        PUB_CT=$(cut -d' ' -f1 out/.tappaas-published 2>/dev/null || echo 0)
        if [ "${PUB_CT:-0}" -gt "$SRC_CT" ]; then
          echo "skip publish: the site is from a newer commit ($(cut -d' ' -f2 out/.tappaas-published))"; exit 0
        fi
        find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp -a site/. out/
        echo "$SRC_CT $CI_COMMIT_SHA $CI_COMMIT_BRANCH" > out/.tappaas-published
        cd out && git add -A
        git commit -qm "Publish ${CI_COMMIT_SHA} (${CI_COMMIT_BRANCH})" || { echo "nothing to publish"; exit 0; }
        git push -q "$SITE_REPO" "HEAD:$SITE_BRANCH"
        echo "published $(git rev-parse --short HEAD) to $SITE_BRANCH"

services:
  kroki:
    image: yuzutech/kroki:latest
    environment:
      KROKI_SAFE_MODE: safe
