# DRAFT: the docs pipeline for a lazysite-served tappaas.org (TAPPaaS
# docs/design/tappaas-org-website.md §6). Not active: it replaces .woodpecker.yml
# when the site moves off Codeberg pages, and runs on the site's own Woodpecker
# (woodpecker-tappaas) against this repository in the tappaas Forgejo.
#
# No MkDocs build: the sync writes Markdown, the converter normalises it for
# lazysite's renderer and adds the navigation, the search index and the layout,
# and the result is pushed to the branch the lazysite instance serves
# (repoBranch). lazysite renders each page on its first visit.
#
# Prerequisites (one-time):
#   - the lazysite instance with repoBranch=live and this pipeline's public key in
#     its repoPushKeys (forgejo:repo makes it a write deploy key);
#   - Woodpecker secrets: site_push_key (the private half), site_repo (the site
#     repository's SSH URL, e.g. ssh://forgejo@forgejo-tappaas.tappaas.internal/websites/lazysite-tappaas.git)
#     and site_known_hosts (Forgejo's SSH host key line).
#   - On two sites (hosting design §5): a second publish step with the other
#     site's repository and key.
#
# Previews: none yet. Pages link site-absolute (/generated/...), so a spike cannot
# live in a sub-directory as it does on Codeberg pages; a preview is a second
# lazysite instance serving another branch.

when:
  - event: [push, manual]
    branch: main

steps:
  build:
    image: python:3.12-slim
    environment:
      KROKI_URL: http://kroki:8000
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl && rm -rf /var/lib/apt/lists/*
      - pip install --no-cache-dir pyyaml
      - |
        for _ in $(seq 30); do curl -sf http://kroki:8000/health >/dev/null && break; sleep 2; done
      - python scripts/sync-source.py
      - ./scripts/lazysite-vendor.sh
      - python scripts/lazysite-site.py site

  publish:
    image: alpine:3.20
    environment:
      SITE_PUSH_KEY:
        from_secret: site_push_key
      SITE_REPO:
        from_secret: site_repo
      SITE_KNOWN_HOSTS:
        from_secret: site_known_hosts
    commands:
      - apk add --no-cache git rsync openssh-client
      - install -d -m 700 ~/.ssh
      - printf '%s\n' "$SITE_PUSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - git config --global user.email "ci@tappaas.org"
      - git config --global user.name "TAPPaaS CI"
      # A build of a commit that is no longer main's head never publishes (an
      # older build finishing last would roll the site back).
      - |
        HEAD_SHA=$(git ls-remote "$CI_REPO_CLONE_URL" refs/heads/main | cut -f1)
        if [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "$CI_COMMIT_SHA" ]; then
          echo "skip publish: main is now at $HEAD_SHA, this build is $CI_COMMIT_SHA"; exit 0
        fi
      - |
        rm -rf out
        git clone --depth 1 --branch live "$SITE_REPO" out 2>/dev/null \
          || { git clone --depth 1 "$SITE_REPO" out && (cd out && git checkout --orphan live && git rm -rfq . || true); }
        rsync -a --delete --exclude=.git site/ out/
        cd out && git add -A
        git commit -qm "Publish $CI_COMMIT_SHA" || { echo "nothing to publish"; exit 0; }
        git push origin HEAD:live

services:
  kroki:
    image: yuzutech/kroki:latest
    environment:
      KROKI_SAFE_MODE: safe
