# Woodpecker CI pipeline for the TAPPaaS Documentation site (Codeberg CI).
#
# Builds the MkDocs site (Kroki renders the ArchiMate/PlantUML diagrams) and
# publishes the output to the `pages` branch, which Codeberg Pages serves at
# https://tappaas.codeberg.page/Documentation/ (canonical while the
# staging.tappaas.org TLS cert is pending — see ADR-001 §11a.5; flip the order
# in `.domains` to make staging canonical again once its cert is issued).
#
# Prototype/spike branches (`spike-*`) publish to `pages-<branch>` and are
# served at https://tappaas.codeberg.page/Documentation/@pages-<branch>/
#
# Prerequisites (one-time, see repo docs / ADR-001 WS-S):
#   - Codeberg CI enabled for this repo.
#   - A Woodpecker secret `codeberg_token`: a Codeberg application token with
#     write access to this repository (Codeberg → Settings → Applications).
#   - A `pages` branch (the pipeline creates it on first run if missing).
#   - DNS: CNAME staging.tappaas.org -> tappaas.codeberg.page. (Cloudflare: DNS-only / grey cloud).

when:
  - event: [push, manual]
    branch: [main, staging, "spike-*"]
  - event: pull_request

steps:
  build:
    image: python:3.12-slim
    commands:
      - pip install --no-cache-dir -r requirements.txt
      # Woodpecker services are reached by service name, not localhost — repoint Kroki.
      - sed -i 's#http://localhost:8000#http://kroki:8000#' mkdocs.yml
      # Wait for the Kroki (JVM) service to answer before building.
      - |
        python - <<'PY'
        import urllib.request, time, sys
        for _ in range(30):
            try:
                urllib.request.urlopen("http://kroki:8000/health", timeout=2)
                print("Kroki ready"); sys.exit(0)
            except Exception:
                time.sleep(2)
        sys.exit("Kroki did not become ready in time")
        PY
      # Spike B: the MkDocs site lives under /docs/, behind the Astro landing.
      - mkdocs build --strict -d site/docs
      # Codeberg Pages custom-domain marker must sit at the served-branch root —
      # only on the real `pages` branch; preview branches must not claim domains.
      - |
        case "$CI_COMMIT_BRANCH" in
          main|staging) cp .domains site/.domains ;;
        esac

  # Spike B: decoupled marketing landing (Astro) served at the site root.
  build-landing:
    image: node:22
    commands:
      - cd landing
      - npm install --no-audit --no-fund --loglevel=error
      # The preview is served under a sub-path; Astro needs it as `base`.
      - ASTRO_BASE="/Documentation/@pages-$CI_COMMIT_BRANCH/" npm run build
      - cp -r dist/. ../site/

  deploy-pages:
    image: alpine:3.20
    when:
      # Publish on branch pushes and manual runs — never on pull requests.
      event: [push, manual]
      branch: [main, staging, "spike-*"]
    environment:
      # Modern Woodpecker (2.x/3.x) secret syntax; exposes the secret as $CODEBERG_TOKEN.
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - apk add --no-cache git rsync
      - git config --global user.email "ci@tappaas.org"
      - git config --global user.name "TAPPaaS CI"
      # Authenticated remote (token is masked in Woodpecker logs).
      - REPO="https://oauth2:$CODEBERG_TOKEN@codeberg.org/TAPPaaS/Documentation.git"
      # main/staging publish the staging site (`pages`); spike-* branches publish
      # previews to `pages-<branch>` (served via the @branch URL scheme).
      - |
        case "$CI_COMMIT_BRANCH" in
          main|staging) TARGET=pages ;;
          *) TARGET="pages-$CI_COMMIT_BRANCH" ;;
        esac
      # Clone the target branch, or create it as an orphan on first run.
      - |
        if ! git clone --depth 1 --branch "$TARGET" "$REPO" pages 2>/dev/null; then
          git clone --depth 1 "$REPO" pages
          cd pages && git checkout --orphan "$TARGET" && git rm -rf . >/dev/null 2>&1 || true; cd ..
        fi
      # Replace the published content with the fresh build (keep .git).
      - rsync -a --delete --exclude='.git' site/ pages/
      - cd pages
      - git add -A
      - git commit -m "Deploy ${CI_COMMIT_SHA} [SKIP CI]" || echo "nothing to publish"
      - git push "$REPO" "HEAD:$TARGET"

services:
  kroki:
    image: yuzutech/kroki:latest
    environment:
      KROKI_SAFE_MODE: safe
      KROKI_PLANTUML_ALLOW_INCLUDE: "true"
