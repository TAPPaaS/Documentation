# Woodpecker CI pipeline for the TAPPaaS Documentation site (Codeberg CI).
#
# Builds the MkDocs site (Kroki renders the ArchiMate/PlantUML diagrams) and
# publishes the output to the `pages` branch, served by Codeberg's NEW
# git-pages server at https://tappaas.codeberg.page/Documentation/
# (the legacy pages server rejects new orgs like TAPPaaS with 400).
#
# git-pages specifics (learned the hard way, see ADR-001 §11a.5):
#   - Only the `pages` branch deploys (ref allowlist is refs/heads/pages),
#     so spike/preview builds publish into spikes/<branch>/ sub-directories
#     of the same branch: .../Documentation/spikes/<branch>/
#   - Deployment is triggered by a Forgejo push webhook per deploy TARGET
#     (one per domain). The repo has no webhooks (the CI token cannot manage
#     hooks), so the deploy step POSTs the payload itself to each target.
#   - Custom domains are authorized purely via DNS (docs.codeberg.org/
#     codeberg-pages/using-custom-domain/): the `.domains` file is DEPRECATED
#     and removed from this repo. staging.tappaas.org needs, in Cloudflare
#     (DNS-only / grey cloud):
#       CNAME staging.tappaas.org -> codeberg.page. (or any name resolving
#         to the pages server; documentation.tappaas.codeberg.page works too)
#       TXT _git-pages-repository.staging.tappaas.org ->
#         "https://codeberg.org/TAPPaaS/Documentation.git"
#   - Serving goes through a ~600 s edge cache; freshly deployed content can
#     lag up to 10 minutes.
#
# Prerequisites (one-time, see repo docs / ADR-001 WS-S):
#   - Codeberg CI enabled for this repo.
#   - A Woodpecker secret `codeberg_token`: a Codeberg application token with
#     write access to this repository (Codeberg → Settings → Applications).
#   - The DNS records above for the staging custom domain.

when:
  - event: [push, manual]
    branch: [main, staging, "spike-*"]
  - event: pull_request

steps:
  build:
    image: python:3.12-slim
    commands:
      - pip install --no-cache-dir -r requirements.txt
      # Woodpecker services are reached by service name, not localhost — repoint Kroki.
      - sed -i 's#http://localhost:8000#http://kroki:8000#' mkdocs.yml
      # Wait for the Kroki (JVM) service to answer before building.
      - |
        python - <<'PY'
        import urllib.request, time, sys
        for _ in range(30):
            try:
                urllib.request.urlopen("http://kroki:8000/health", timeout=2)
                print("Kroki ready"); sys.exit(0)
            except Exception:
                time.sleep(2)
        sys.exit("Kroki did not become ready in time")
        PY
      - mkdocs build --strict

  deploy-pages:
    image: alpine:3.20
    when:
      # Publish on branch pushes and manual runs — never on pull requests.
      event: [push, manual]
      branch: [main, staging, "spike-*"]
    environment:
      # Modern Woodpecker (2.x/3.x) secret syntax; exposes the secret as $CODEBERG_TOKEN.
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - apk add --no-cache git rsync curl
      - git config --global user.email "ci@tappaas.org"
      - git config --global user.name "TAPPaaS CI"
      # Authenticated remote (token is masked in Woodpecker logs).
      - REPO="https://oauth2:$CODEBERG_TOKEN@codeberg.org/TAPPaaS/Documentation.git"
      # Everything publishes into the single `pages` branch: main/staging own
      # the root (leaving spikes/ alone); spike-* branches own spikes/<branch>/.
      - |
        case "$CI_COMMIT_BRANCH" in
          main|staging) DEST="" ;;
          *) DEST="spikes/$CI_COMMIT_BRANCH" ;;
        esac
      # Publish with a couple of retries in case a concurrent pipeline pushed
      # to `pages` between our clone and push.
      - |
        publish() {
          rm -rf pages
          if ! git clone --depth 1 --branch pages "$REPO" pages 2>/dev/null; then
            git clone --depth 1 "$REPO" pages
            (cd pages && git checkout --orphan pages && git rm -rf . >/dev/null 2>&1 || true)
          fi
          if [ -z "$DEST" ]; then
            rsync -a --delete --exclude='.git' --exclude='spikes/' site/ pages/
          else
            mkdir -p "pages/$DEST"
            rsync -a --delete site/ "pages/$DEST/"
          fi
          (
            cd pages
            git add -A
            git commit -m "Deploy $CI_COMMIT_BRANCH $CI_COMMIT_SHA [SKIP CI]" || echo "nothing to publish"
            git push "$REPO" HEAD:pages
          )
        }
        publish || publish || publish
      # No git-pages webhooks exist on the repo (token lacks hook-admin
      # rights), so notify the pages server ourselves with the payload a
      # Forgejo push webhook would send — once per deploy target. The
      # staging.tappaas.org target only works once its DNS TXT authorization
      # record exists; don't fail the build on it while that's pending.
      - |
        notify() {
          curl -s -X POST "$1" \
            -H "Content-Type: application/json" \
            -H "X-Forgejo-Event: push" \
            -d '{"ref":"refs/heads/pages","repository":{"full_name":"TAPPaaS/Documentation","name":"Documentation","private":false,"clone_url":"https://codeberg.org/TAPPaaS/Documentation.git","html_url":"https://codeberg.org/TAPPaaS/Documentation","default_branch":"main","owner":{"login":"TAPPaaS","username":"TAPPaaS"}}}'
          echo " <- $1"
        }
        notify "https://tappaas.codeberg.page/Documentation"
        notify "https://staging.tappaas.org" || true

services:
  kroki:
    image: yuzutech/kroki:latest
    environment:
      KROKI_SAFE_MODE: safe
      KROKI_PLANTUML_ALLOW_INCLUDE: "true"
